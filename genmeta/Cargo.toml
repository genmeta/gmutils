[package]
name = "genmeta"
description = "Genmeta Binary Utilities"
version = "0.9.0-preview.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["genmeta", "dhttp", "cli", "launcher"]
categories = ["command-line-utilities"]

[dependencies]
clap = { workspace = true }
ddns = { workspace = true }
dhttp = { workspace = true }
dhttp-home = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
genmeta-access = { workspace = true }
genmeta-curl = { workspace = true }
genmeta-discover = { workspace = true }
genmeta-doctor = { workspace = true }
genmeta-identity = { workspace = true, features = ["cli"] }
genmeta-nslookup = { workspace = true }
genmeta-proxy = { workspace = true }
snafu = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
dhttp-identity = { workspace = true }
sha2 = "0.10"
tempfile = "3"
qtls = { workspace = true }
dirs = { workspace = true }
url = "2"
rustix = { version = "1", features = ["fs"] }
toml = "1"
urlencoding = { workspace = true }
webc = { version = "=12.0.1", default-features = false, features = ["v3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bytes = { workspace = true }
futures = { workspace = true }
qbase = { workspace = true }
qprotocol = { workspace = true }
rcgen = "0.14"
rustls-pemfile = "2"
http-body = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
