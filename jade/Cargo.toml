[package]
name = "jade"
description = "Create, build, sign and publish Pishoo packages"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["genmeta", "pishoo", "package", "wasm", "cli"]
categories = ["command-line-utilities"]

[dependencies]
base64 = { workspace = true }
clap = { workspace = true }
ddns = { workspace = true }
dhttp = { workspace = true }
dhttp-home = { workspace = true, features = ["manage"] }
dhttp-identity = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
inquire = { workspace = true }
qtls = { workspace = true }
rustix = { version = "1", features = ["fs"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
snafu = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
toml = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"
urlencoding = { workspace = true }
webc = { version = "=12.0.1", default-features = false, features = ["v3"] }
wasmparser = "0.244"
wit-parser = { version = "0.244", default-features = false, features = ["decoding"] }
x509-parser = { workspace = true }
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bytes = { workspace = true }
futures = { workspace = true }
http-body = "1"
qbase = { workspace = true }
qprotocol = { workspace = true }
rcgen = "0.14"
rustls-pemfile = "2"
tower = { version = "0.5", features = ["util"] }
