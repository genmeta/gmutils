[package]
name = "genmeta-curl"
description = "curl-like DHTTP/3 client"
version = "0.8.0-preview.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["genmeta", "dhttp", "http3", "client", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
http-body-util.workspace = true
futures.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
ddns.workspace = true
dhttp-home = { workspace = true, features = ["manage"] }
dhttp-identity.workspace = true
async-compression = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dhttp = { workspace = true }
qprotocol = { workspace = true }
qtls = { workspace = true }
http = { workspace = true }
indicatif = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-indicatif = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
