
[workspace]
resolver = "3"
members = [
    "genmeta",
    "genmeta-access",
    "genmeta-curl",
    "genmeta-nslookup",
    "genmeta-discover",
    "genmeta-nat",
    "genmeta-doctor",
    "genmeta-identity",
    "genmeta-proxy",
]
exclude = ["xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/genmeta/gmutils"
homepage = "https://www.dhttp.net"
readme = "README.md"

[workspace.dependencies]
# async
futures = "0.3"
daemonize = "0.5"
tokio = { version = "1", features = ["full"] }

# cli
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
indicatif = "0.18"
whoami = "2"

# network
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
urlencoding = "2"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "gzip",
    "json",
    "zstd",
    "rustls",
] }

# security
rustls = { package = "qrustls", version = "0.23.45", default-features = false, features = ["ring"] }
x509-parser = "0.18"
p384 = "0.13"
pkcs8 = { version = "0.10", features = ["pem"] }
qrcode = { version = "0.14.1", default-features = false }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tracing
tracing = { version = "0.1", default-features = false, features = [
    "std",
    "attributes",
] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "time",
    "local-time",
] }
tracing-indicatif = { version = "0.3" }

# utils
base64 = "0.23"
bytes = "1"
chrono = "0.4"
crossterm = { version = "0.29" }
dirs = { version = "6" }
sea-orm = { version = "2", features = ["runtime-tokio-rustls"] }
snafu = "0.9"
socket2 = "0.6"
nix = { version = "0.31", default-features = false, features = ["user"] }
time = "0.3"
async-compression = { version = "0.4", features = [
    "tokio",
    "gzip",
    "deflate",
    "zstd",
] }

# workspace
genmeta-access = { path = "genmeta-access", version = "0.5.0-preview.3" }
dhttp = { version = "0.7.1", features = ["online-identity", "log"] }
dhttp-identity = "0.3.0"
access_control = { package = "daccess", version = "0.1.1", git = "https://github.com/genmeta/daccess.git", rev = "1bd97a7d2e8bd572cde700b1ec52c8ca8fca2ee4" }
dhttp-home = { version = "0.6.1" }
ddns = { version = "0.8.0", package = "dyns", features = ["h3", "http", "mdns"] }
qbase = { version = "0.7.0" }
qprotocol = { version = "0.7.0" }
qtls = { version = "0.1.0" }
genmeta-curl = { path = "genmeta-curl", version = "0.8.0-preview.3" }
genmeta-discover = { path = "genmeta-discover", version = "0.5.0-preview.2" }
genmeta-doctor = { path = "genmeta-doctor", version = "0.5.0-preview.2" }
genmeta-identity = { path = "genmeta-identity", version = "0.5.0-preview.4", default-features = false }
genmeta-nat = { path = "genmeta-nat", version = "0.6.0-preview.2" }
genmeta-nslookup = { path = "genmeta-nslookup", version = "0.6.0-preview.2" }
genmeta-proxy = { path = "genmeta-proxy", version = "0.5.0-preview.2" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
