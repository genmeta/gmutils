
[workspace]
resolver = "3"
members = [
    "genmeta",
    "genmeta-access",
    "genmeta-curl",
    "genmeta-network",
    "genmeta-nslookup",
    "genmeta-discover",
    "genmeta-nat",
    "genmeta-doctor",
    "genmeta-identity",
    "genmeta-proxy",
]
exclude = ["xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/genmeta/gmutils"
homepage = "https://www.dhttp.net"
readme = "README.md"

[workspace.dependencies]
# async
futures = "0.3"
daemonize = "0.5"
tokio = { version = "1", features = ["full"] }

# cli
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
indicatif = "0.18"
whoami = "2"

# network
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
urlencoding = "2"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "gzip",
    "json",
    "zstd",
    "rustls-no-provider",
] }

# security
rustls = { version = "0.23", default-features = false, features = ["ring"] }
x509-parser = "0.18"
p384 = "0.13"
pkcs8 = { version = "0.10", features = ["pem"] }
qrcode = { version = "0.14.1", default-features = false }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tracing
tracing = { version = "0.1", default-features = false, features = [
    "std",
    "attributes",
] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "time",
    "local-time",
] }
tracing-indicatif = { version = "0.3" }

# utils
base64 = "0.23"
bytes = "1"
chrono = "0.4"
crossterm = { version = "0.29" }
dirs = { version = "6" }
sea-orm = { version = "2", features = ["runtime-tokio-rustls"] }
snafu = "0.9"
socket2 = "0.6"
nix = { version = "0.31", default-features = false, features = ["user"] }
time = "0.3"
async-compression = { version = "0.4", features = [
    "tokio",
    "gzip",
    "deflate",
    "zstd",
] }

# workspace
genmeta-access = { path = "genmeta-access", version = "0.4.2" }
dhttp = { path = "../dhttp/dhttp", version = "0.6.2" }
access_control = { path = "../daccess" }
dhttp-home = { path = "../dhttp/home", version = "0.5.0" }
ddns = { package = "dyns", path = "../ddns", features = ["h3", "http", "mdns"] }
qbase = { path = "../dquic/qbase" }
qprotocol = { path = "../dquic/qprotocol" }
qtls = { path = "../dquic/qtls" }
genmeta-network = { path = "genmeta-network" }
genmeta-curl = { path = "genmeta-curl", version = "0.7.1" }
genmeta-discover = { path = "genmeta-discover", version = "0.4.2" }
genmeta-doctor = { path = "genmeta-doctor", version = "0.4.1" }
genmeta-identity = { path = "genmeta-identity", version = "0.4.2", default-features = false }
genmeta-nat = { path = "genmeta-nat", version = "0.5.1" }
genmeta-nslookup = { path = "genmeta-nslookup", version = "0.5.1" }
genmeta-proxy = { path = "genmeta-proxy", version = "0.4.1" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep registry dependencies on the same adjacent project sources.
[patch.crates-io]
dhttp = { path = "../dhttp/dhttp", version = "0.6.2" }
dhttp-home = { path = "../dhttp/home", version = "0.5.0" }
dyns = { path = "../ddns" }
h3x = { path = "../h3x", version = "0.6.2" }
qbase = { path = "../dquic/qbase" }
qcongestion = { path = "../dquic/qcongestion" }
qconnection = { path = "../dquic/qconnection" }
qevent = { path = "../dquic/qevent" }
qmacro = { path = "../dquic/qmacro" }
qprotocol = { path = "../dquic/qprotocol" }
qrecovery = { path = "../dquic/qrecovery" }
qresolve = { path = "../dquic/qresolve" }
qtls = { path = "../dquic/qtls" }
qtransport = { path = "../dquic/qtransport" }
qtraversal = { path = "../dquic/qtraversal" }
qudp = { path = "../dquic/qudp" }
