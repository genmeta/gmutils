name: Jade application

on:
  workflow_call:
    inputs:
      jade-ref:
        description: Immutable gmutils commit, matching the reusable workflow ref
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.ref_type == 'tag' && 'release' || 'ci' }}
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.1
      JADE_REF: ${{ inputs.jade-ref }}
    defaults:
      run:
        shell: bash
        working-directory: application
    steps:
      - uses: actions/checkout@v6
        with:
          path: application
          fetch-depth: 0
          persist-credentials: false
      - name: Require an immutable Jade revision
        run: |
          [[ "$JADE_REF" =~ ^[0-9a-f]{40}$ ]]
          echo "DHTTP_HOME=$RUNNER_TEMP/jade-identity" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          repository: genmeta/gmutils
          ref: ${{ inputs.jade-ref }}
          path: gmutils
          persist-credentials: false
      - name: Validate application and release tag
        id: app
        run: python3 ../gmutils/.github/scripts/jade-app.py metadata
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --target wasm32-wasip2
      - uses: actions/setup-node@v6
        if: steps.app.outputs.frontend != ''
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        if: steps.app.outputs.frontend != ''
        with:
          bun-version: '1.4.3'
      - name: Install WASI SDK
        if: steps.app.outputs.backend != ''
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo "0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-33.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build Jade
        env:
          DHTTP_ROOT_CA_PEM: ${{ vars.DHTTP_ROOT_CA_PEM }}
          DHTTP_BOOTSTRAP_URL: ${{ vars.DHTTP_BOOTSTRAP_URL }}
          DHTTP_NAME_SERVICE: ${{ vars.DHTTP_NAME_SERVICE }}
          DHTTP_MDNS_SERVICE_DOMAIN: ${{ vars.DHTTP_MDNS_SERVICE_DOMAIN }}
          DHTTP_CA_SERVICE: ${{ vars.DHTTP_CA_SERVICE }}
        run: |
          for key in DHTTP_ROOT_CA_PEM DHTTP_BOOTSTRAP_URL DHTTP_NAME_SERVICE DHTTP_MDNS_SERVICE_DOMAIN DHTTP_CA_SERVICE; do
            if [[ -z "${!key}" ]]; then unset "$key"; fi
          done
          cargo build --manifest-path ../gmutils/Cargo.toml --locked --release -p jade
          echo "$GITHUB_WORKSPACE/gmutils/target/release" >> "$GITHUB_PATH"
      - name: Prepare and test frontend
        if: steps.app.outputs.frontend != ''
        env:
          FRONTEND: ${{ steps.app.outputs.frontend }}
        run: |
          cd "$FRONTEND"
          if [[ -f package.json ]]; then
            bun install --frozen-lockfile
            if [[ -d tests ]]; then bun test ./tests; fi
          fi
      - name: Test Rust backend
        if: steps.app.outputs.backend != ''
        env:
          BACKEND: ${{ steps.app.outputs.backend }}
        run: |
          cd "$BACKEND"
          cargo fmt --all -- --check
          cargo test --locked
      - name: Test development command
        run: |
          if [[ -f tests/test_dev.py ]]; then python3 -m unittest discover -s tests -p 'test_*.py'; fi
      - name: Create isolated CI signing identity
        if: github.ref_type != 'tag'
        run: python3 ../gmutils/.github/scripts/jade-app.py fixture --home "$DHTTP_HOME"
      - name: Load release identity
        if: github.ref_type == 'tag'
        env:
          DHTTP_AUTHOR_CERT: ${{ secrets.DHTTP_AUTHOR_CERT }}
          DHTTP_AUTHOR_KEY: ${{ secrets.DHTTP_AUTHOR_KEY }}
          DHTTP_AUTHOR_OCSP: ${{ secrets.DHTTP_AUTHOR_OCSP }}
        run: |
          umask 077
          python3 ../gmutils/.github/scripts/jade-app.py credentials --home "$DHTTP_HOME"
      - name: Build and sign package
        run: |
          mkdir -p .jade
          jade --json build > .jade/build.json
          git diff --exit-code -- '*lock*'
          python3 ../gmutils/.github/scripts/jade-app.py receipt
      - name: Preserve the exact signed package before upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.app.outputs.name }}-${{ steps.app.outputs.version }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            application/.jade/*.waz
            application/.jade/build.json
            application/.jade/SHA256SUMS
            application/.jade/provenance.json
      - name: Publish the saved package
        if: github.ref_type == 'tag'
        env:
          PACKAGE_NAME: ${{ steps.app.outputs.name }}
          PACKAGE_VERSION: ${{ steps.app.outputs.version }}
        run: |
          (cd .jade && sha256sum --check SHA256SUMS)
          jade --json publish ".jade/$PACKAGE_NAME-$PACKAGE_VERSION.waz" > .jade/publish.json
      - name: Save publication receipt, including uncertain outcomes
        if: always() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: publication-${{ steps.app.outputs.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: application/.jade/publish.json
      - name: Remove temporary credentials
        if: always()
        run: rm -rf -- "$DHTTP_HOME"
