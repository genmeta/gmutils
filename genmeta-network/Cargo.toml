[package]
name = "genmeta-network"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dirs.workspace = true
dhttp = { workspace = true, features = ["access-cli", "access-migration", "log"] }
dhttp-home = { path = "../../dhttp/home" }
dhttp-identity = "0.3.0"
ddns = { package = "dyns", path = "../../ddns", features = ["h3", "http", "mdns"] }
qprotocol = { path = "../../dquic/qprotocol" }
qbase = { path = "../../dquic/qbase" }
qtls = { path = "../../dquic/qtls" }
reqwest.workspace = true
x509-parser.workspace = true
der = "0.7"
sha1 = "0.10"
x509-cert = "0.2"
x509-ocsp = "0.2"
tempfile = "3"
serde.workspace = true
toml = "1"
http.workspace = true
futures.workspace = true
rustls.workspace = true
snafu.workspace = true
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
rustls-pemfile = "2"
x509-parser.workspace = true
